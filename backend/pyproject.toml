[project]
name = "ai-event-planner-backend"
version = "0.1.0"
description = "GenAI-powered Event Planning Assistant Backend with FastAPI and Gemini"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "google-genai>=0.1.1",
    "tenacity>=9.0.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.2",
    "pyjwt>=2.9.0",
    "email-validator>=2.0.0",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["app/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["B008", "E501", "F401", "F403", "F405", "E402", "B904", "B010", "B017", "B007", "F841"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = false
disable_error_code = ["arg-type", "assignment", "attr-defined", "return-value", "valid-type"]
