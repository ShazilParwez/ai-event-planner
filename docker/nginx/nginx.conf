# ==============================================================================
# AI Event Planner - Production Reverse Proxy Gateway Configuration
# Same-origin routing:
#   /api/ -> Backend FastAPI service (http://backend:8000)
#   /     -> Frontend React SPA service (http://frontend:80)
# ==============================================================================

upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

upstream frontend_upstream {
    server frontend:80;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # Maximum client payload size (supports moodboard image uploads)
    client_max_body_size 15M;

    # Gzip compression configuration
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Centralized defense-in-depth security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # Gateway Health Probe
    # --------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        return 200 "gateway-healthy\n";
    }

    # --------------------------------------------------------------------------
    # Backend API Routing (/api/ -> FastAPI)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        # Forwarded connection and client metadata
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Bounded timeouts for AI Copilot operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffer sizing
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    # --------------------------------------------------------------------------
    # Frontend SPA Routing (/ -> Nginx Static Asset Server)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Custom error pages
    error_page 502 503 504 /gateway_error.json;
    location = /gateway_error.json {
        internal;
        default_type application/json;
        return 503 '{"success": false, "message": "Service temporarily unavailable. Upstream services are starting or unreachable.", "data": null}';
    }
}

