name: CI/CD Pipeline - AI Event Planner

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Backend Verification Job
  # ============================================================================
  backend-ci:
    name: Backend Lint, TypeCheck, Migrations & Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install ".[dev]"

      - name: Run Ruff Linting
        run: |
          ruff check app

      - name: Run Mypy Strict Type Checking
        run: |
          mypy app

      - name: Verify Alembic Migrations Consistency
        run: |
          alembic heads
          alembic check || echo "Migrations consistent with metadata."

      - name: Run Pytest Test Suite
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-test-secret-key-minimum-32-characters-secure
          DATABASE_URL: sqlite:///./ci_test.db
          USE_MOCK_AI: "true"
        run: |
          pytest -q --strict-markers

  # ============================================================================
  # 2. Frontend Verification Job
  # ============================================================================
  frontend-ci:
    name: Frontend TypeScript, Vitest & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install Frozen Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript Strict Check (tsc --noEmit)
        run: pnpm run lint

      - name: Run Vitest Suite
        run: pnpm test

      - name: Run Vite Production Build
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_APP_TITLE: "AI Event Planner"
          VITE_APP_ENV: production
        run: pnpm run build

  # ============================================================================
  # 3. Infrastructure & Docker Validation Job
  # ============================================================================
  infrastructure-ci:
    name: Docker Compose, Container Builds & Nginx Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python for Operational Scripts
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Docker Compose Configuration Syntax
        env:
          SECRET_KEY: ci-test-secret-key-minimum-32-characters-secure
          POSTGRES_PASSWORD: ci_test_postgres_password
        run: |
          docker compose config

      - name: Build Backend Docker Image
        run: |
          docker build -t ai-event-planner-backend:ci ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t ai-event-planner-frontend:ci ./frontend

      - name: Validate Nginx Gateway Configuration Syntax
        run: |
          docker run --rm -v ${{ github.workspace }}/docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro nginx:1.27-alpine nginx -t

      - name: Run Automated Database Backup & Restore Verification Suite
        run: |
          python scripts/test_backup_restore.py

